# Sandbox-only trial. Requests a Codex review once per pushed commit on claude/* PRs
# (only when Codex has not already started one). Review only: Codex never edits code.
# Uses the built-in GITHUB_TOKEN with pull-requests: write. No secrets, no paid services.
name: Request Codex review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Request @codex review if Codex has not started on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fetch() {
            gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate | jq -s 'add // []' > "$RUNNER_TEMP/comments.json"
            gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" --paginate | jq -s 'add // []' > "$RUNNER_TEMP/reviews.json"
            node scripts/codex-request-decision.js "$SHA" "$RUNNER_TEMP/comments.json" "$RUNNER_TEMP/reviews.json" 3
          }

          # Give Codex time to start on its own (comment or review on this commit).
          for i in 1 2 3 4 5 6; do
            sleep 15
            if [ "$(fetch)" = "started" ]; then
              echo "Codex already started on $SHA; nothing to request."
              exit 0
            fi
          done

          # Once per commit, at most 3 automatic requests per PR.
          if [ "$(fetch)" != "request" ]; then
            echo "Skipping request (already requested or cap reached)."
            exit 0
          fi

          gh pr comment "$PR" --repo "$REPO" --body "@codex review

          <!-- codex-auto-request:${SHA} -->
          Automatic review request for \`${SHA:0:7}\` (GitHub Actions, sandbox trial)."
