name: collab-intake

# Receives "[MONE-REQUEST]" comments written by the repository owner.
# The code lives in amone-core and is pinned to one commit.
on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: collab-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '[MONE-REQUEST]') ||
       startsWith(github.event.comment.body, '[AMU-RESULT]'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: amukutsurogiwork-oss/amone-core/.github/actions/intake@243ca587337282fa0a92408c51f899035237d5c4
